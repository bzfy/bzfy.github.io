<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Contents</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f8f8f8;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #listing {
      max-width: 800px;
      margin: 0 auto;
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .item {
      padding: 8px 12px;
      margin: 4px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.3s;
      cursor: pointer;
    }
    .item:last-child {
      border-bottom: none;
    }
    .item:hover {
      background-color: #e0e0e0;
    }
    .item.selected {
      background-color: #e0e0e0;
    }
    /* 文件夹、文件和返回项统一样式，简约无额外装饰 */
    .folder {
      font-weight: bold;
    }
    .file {
      /* 文件样式和文件夹一致 */
    }
    .back {
      /* 返回上级目录不采用蓝色或下划线 */
      color: inherit;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <h1>Contents</h1>
  <div id="listing"></div>

  <script>
    // 请根据实际情况修改以下变量
    const owner = 'bzfy';           // GitHub 用户名
    const repo = 'bzfy.github.io';    // 仓库名
    const branch = 'bzfy';            // 分支名称（例如：develop 或 main，此处使用自定义分支）
    const pageBase = 'https://bzfy.github.io';  // GitHub Pages 域名

    const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents`;
    let currentPath = '';  // 当前路径（根目录为空字符串）

    // 清除选中效果
    function clearSelected() {
      const items = document.querySelectorAll('#listing .item');
      items.forEach(item => item.classList.remove('selected'));
    }

    // 根据路径获取目录内容，并显示
    function fetchAndDisplay(path) {
      currentPath = path || '';
      let url = apiBase;
      if (currentPath !== '') {
        url += '/' + currentPath;
      }
      url += `?ref=${branch}`;
      fetch(url)
        .then(response => response.json())
        .then(data => displayList(data))
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('listing').innerText = '获取目录失败。';
        });
    }

    // 渲染目录列表
    function displayList(items) {
      const listing = document.getElementById('listing');
      listing.innerHTML = '';

      // 如果不在根目录，添加“返回上级目录”
      if (currentPath !== '') {
        const backDiv = document.createElement('div');
        backDiv.className = 'item back';
        backDiv.textContent = '← 返回上级目录';
        backDiv.onclick = function() {
          clearSelected();
          backDiv.classList.add('selected');
          const parts = currentPath.split('/');
          parts.pop();
          fetchAndDisplay(parts.join('/'));
        };
        listing.appendChild(backDiv);
      }

      // 排序：目录在前，文件在后，同类按名称排序
      items.sort((a, b) => {
        if (a.type === 'dir' && b.type !== 'dir') return -1;
        if (a.type !== 'dir' && b.type === 'dir') return 1;
        return a.name.localeCompare(b.name);
      });

      // 遍历列表
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        if (item.type === 'dir') {
          div.classList.add('folder');
          div.textContent = '📁 ' + item.name;
          div.onclick = function() {
            clearSelected();
            div.classList.add('selected');
            const newPath = currentPath ? currentPath + '/' + item.name : item.name;
            fetchAndDisplay(newPath);
          };
        } else if (item.type === 'file') {
          div.classList.add('file');
          div.textContent = '📄 ' + item.name;
          // 整行点击
          div.onclick = function() {
            clearSelected();
            div.classList.add('selected');
            let relativePath = currentPath ? currentPath + '/' + item.name : item.name;
            if (relativePath.endsWith('.md')) {
              relativePath = relativePath.slice(0, -3);
            }
            window.open(pageBase + '/' + relativePath, '_blank');
            // 300毫秒后清除选中状态
            setTimeout(() => {
              div.classList.remove('selected');
            }, 300);
          };
        }
        listing.appendChild(div);
      });
    }

    // 初始加载根目录
    fetchAndDisplay('');
  </script>
</body>
</html>
